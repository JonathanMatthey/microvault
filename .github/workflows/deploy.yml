name: Deploy MicroVault

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Install pnpm globally
        run: npm install -g pnpm@9

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 65.21.180.95 content.skatkis-tech.net microvault.skatkis-tech.net >> ~/.ssh/known_hosts

      - name: Run deploy script
        run: bash server/deploy.sh
