server {
    server_name selfstack.skatkis-tech.net;

    root /var/www/selfstack.skatkis-tech.net;
    index index.html;

    # Security headers for all responses
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    location / {
        try_files $uri $uri/ /index.html;
        # CSP for HTML - Allow Google Sign-In and Next.js inline scripts
        add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com https://content.skatkis-tech.net" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com https://content.skatkis-tech.net" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/selfstack.skatkis-tech.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/selfstack.skatkis-tech.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = selfstack.skatkis-tech.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name selfstack.skatkis-tech.net;
    return 404; # managed by Certbot


}
