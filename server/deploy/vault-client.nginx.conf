server {
    server_name vault.skatkis-tech.net;

    root /var/www/vault.skatkis-tech.net;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Restrict monetization pointer origin per spec (optional hardening)
    add_header Content-Security-Policy "monetization-src https://ilp.interledger-test.dev" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache for HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/content.skatkis-tech.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/content.skatkis-tech.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = vault.skatkis-tech.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name vault.skatkis-tech.net;
    return 404; # managed by Certbot


}
