server {
    server_name content.skatkis-tech.net;

    # Increase client max body size for large file uploads
    client_max_body_size 1000G;
    client_body_timeout 1200s;

    # Proxy timeouts for long-running uploads
    proxy_connect_timeout 1200s;
    proxy_send_timeout 1200s;
    proxy_read_timeout 1200s;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve Cloudflare's original proto to avoid mixed content URLs in Location headers
        # If CF sets X-Forwarded-Proto=https, pass it through; otherwise fall back to $scheme
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # TUS protocol headers
        proxy_set_header Upload-Offset $http_upload_offset;
        proxy_set_header Upload-Length $http_upload_length;
        proxy_set_header Upload-Metadata $http_upload_metadata;
        proxy_set_header Tus-Resumable $http_tus_resumable;
        
        # Disable buffering for streaming uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/content.skatkis-tech.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/content.skatkis-tech.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = content.skatkis-tech.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name content.skatkis-tech.net;
    return 404; # managed by Certbot


}

